plantillas.comoEscribir=How do I write a Word template?
plantillas.comoEscribir.texto=1. In Word, type placeholders with double braces where each value goes: {{client}}, {{city}}, {{total}}.\n2. For a table with all rows: in the header row of the table add {{filas}} in any cell, and in the row below type [product], [quantity], [price]. That row is repeated for each record.\n3. Type each placeholder in one go, without changing its formatting halfway.\n4. Do not use dots in names. For the [ ] table columns, avoid accents and spaces.
