plantillas.comoEscribir=¿Cómo escribir una plantilla de Word?
plantillas.comoEscribir.texto=1. En Word, escriba los marcadores con dos llaves donde va cada dato: {{cliente}}, {{ciudad}}, {{total}}.\n2. Para una tabla con todas las filas: en la fila de títulos de la tabla agregue {{filas}} en cualquier celda, y en la fila de abajo escriba [producto], [cantidad], [valor]. Esa fila se repite por cada registro.\n3. Escriba cada marcador de una sola vez, sin cambiarle el formato a la mitad.\n4. Use nombres sin puntos. En las columnas [ ] de la tabla, mejor sin tildes ni espacios.
