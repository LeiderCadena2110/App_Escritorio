# Messages shown to the user for each ErrorCode (MessageFormat: {0}, {1}... are the arguments).
# Numbers that are not amounts use {n,number,#} so they are not formatted with thousands separators.

# Products
error.PRODUCT_SKU_REQUIRED=Escriba el código (SKU) del producto.
error.PRODUCT_SKU_TOO_LONG=El código (SKU) puede tener máximo {0,number,#} caracteres.
error.PRODUCT_NAME_REQUIRED=Escriba el nombre del producto.
error.PRODUCT_BARCODE_INVALID=El código de barras solo puede tener letras, números y guiones (4 a 50).
error.PRODUCT_COST_NEGATIVE=El precio de costo no puede ser negativo.
error.PRODUCT_PRICE_NOT_POSITIVE=El precio de venta debe ser mayor que 0.
error.PRODUCT_MIN_STOCK_NEGATIVE=El stock mínimo no puede ser negativo.
error.PRODUCT_TAX_RATE_OUT_OF_RANGE=El IVA del producto debe estar entre 0 y 100 %.
error.PRODUCT_INITIAL_STOCK_NEGATIVE=El stock inicial no puede ser negativo.
error.PRODUCT_SKU_DUPLICATED=Ya existe un producto con el código {0} ({1}).
error.PRODUCT_BARCODE_DUPLICATED=El código de barras {0} ya lo tiene {1} · {2}.
error.PRODUCT_INACTIVE=El producto {0} está inactivo.
error.PRODUCT_NOT_SELECTED=Elija un producto de la lista.
error.PRODUCT_NOT_FOUND=No se encontró el producto con id {0,number,#}.

# Stock
# Stock errors receive: {0} SKU, {1} name, {2} units available, {3} units requested, {4} unit (PAR, UND...)
error.STOCK_INSUFFICIENT=Solo hay {2,number,#} {4} de {0} · {1} y se necesitan {3,number,#}.
error.STOCK_SOLD_OUT={0} · {1} está agotado.
error.STOCK_ADJUSTMENT_ZERO=La cantidad del ajuste no puede ser 0.
error.STOCK_QUANTITY_NOT_POSITIVE=La cantidad debe ser mayor que 0.

# Customers, suppliers and categories
error.CUSTOMER_DOCUMENT_REQUIRED=Escriba el número de documento del cliente.
error.CUSTOMER_NAME_REQUIRED=Escriba el nombre del cliente.
error.CUSTOMER_EMAIL_INVALID=El correo "{0}" no es válido.
error.CUSTOMER_DOCUMENT_DUPLICATED=Ya existe un cliente con el documento {0} ({1}).
error.CUSTOMER_FINAL_CONSUMER_PROTECTED=El cliente "Consumidor final" no se puede eliminar.
error.CUSTOMER_HAS_INVOICES=No se puede eliminar a {0} porque tiene {1,number,#} factura(s).
error.SUPPLIER_NAME_REQUIRED=Escriba el nombre del proveedor.
error.CATEGORY_NAME_REQUIRED=Escriba el nombre de la categoría.
error.CATEGORY_DUPLICATED=Ya existe una categoría llamada "{0}".

# Invoices
error.INVOICE_EMPTY=Agregue al menos un producto a la factura.
error.INVOICE_DISCOUNT_NEGATIVE=El descuento no puede ser negativo.
error.INVOICE_DISCOUNT_ABOVE_SUBTOTAL=El descuento no puede ser mayor que el subtotal.
error.INVOICE_QUANTITY_NOT_POSITIVE=Las cantidades deben ser mayores que 0.
error.INVOICE_CASH_INSUFFICIENT=El dinero recibido ({0}) es menor que el total ({1}).
error.INVOICE_ALREADY_CANCELLED=La factura {0} ya está anulada.
error.INVOICE_CANCEL_REASON_REQUIRED=Escriba el motivo de la anulación.
error.INVOICE_NOT_FOUND=No se encontró la factura con id {0,number,#}.

# Settings and numbering
error.SEQUENCE_PREFIX_TOO_LONG=El prefijo de factura puede tener máximo {0,number,#} caracteres.
error.SEQUENCE_NEXT_NOT_POSITIVE=El siguiente número de factura debe ser mayor que 0.
error.SETTINGS_BUSINESS_NAME_REQUIRED=Escriba el nombre del negocio.
error.SETTINGS_TAX_RATE_OUT_OF_RANGE=El IVA debe estar entre 0 y 100 %.
