<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${titulo}">Cuenta de cobro</title>
    <style>
        @page { size: letter; margin: 2.2cm; @bottom-center { content: "Página " counter(page) " de " counter(pages); font-size: 9pt; color: #7b8794; } }
        body { font-family: sans-serif; color: #1f2933; font-size: 11pt; }
        .salto { page-break-after: always; }
        .encabezado { border-bottom: 2px solid #1d4e89; padding-bottom: 8px; margin-bottom: 24px; }
        h1 { color: #1d4e89; font-size: 22pt; margin: 0; }
        .ciudad { color: #52606d; margin-top: 4px; }
        .etiqueta { color: #52606d; font-size: 9pt; text-transform: uppercase; letter-spacing: 1px; margin-top: 18px; }
        .dato { font-size: 13pt; margin-top: 2px; }
        table { width: 100%; border-collapse: collapse; margin-top: 26px; }
        th { background: #1d4e89; color: #ffffff; text-align: left; padding: 8px; font-size: 10pt; }
        td { border-bottom: 1px solid #cbd2d9; padding: 10px 8px; }
        .valor { text-align: right; white-space: nowrap; }
        .total td { font-weight: bold; border-bottom: none; font-size: 13pt; }
        .firma { margin-top: 70px; width: 7cm; border-top: 1px solid #1f2933; padding-top: 4px; }
    </style>
</head>
<body>
<!-- Campos: fila['cliente'], fila['nit'], fila['concepto'], fila['valor'], fila['ciudad'], fila['fecha'] -->
<div th:each="fila, iter : ${filas}" th:classappend="${!iter.last} ? 'salto'">
    <div class="encabezado">
        <h1>Cuenta de cobro</h1>
        <div class="ciudad"><span th:text="${fila['ciudad']}">Ciudad</span>, <span th:text="${fila['fecha']}">fecha</span></div>
    </div>
    <div class="etiqueta">Debe a la orden de / cliente</div>
    <div class="dato" th:text="${fila['cliente']}">Cliente</div>
    <div class="etiqueta">NIT o documento</div>
    <div class="dato" th:text="${fila['nit']}">000</div>
    <table>
        <tr><th>Concepto</th><th class="valor">Valor</th></tr>
        <tr><td th:text="${fila['concepto']}">Concepto</td><td class="valor" th:text="${fila['valor']}">0</td></tr>
        <tr class="total"><td>Total</td><td class="valor" th:text="${fila['valor']}">0</td></tr>
    </table>
    <div class="firma">Firma</div>
</div>
</body>
</html>
