<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${titulo}">Listado</title>
    <style>
        @page { size: A4 landscape; margin: 1.5cm; @bottom-right { content: counter(page) " / " counter(pages); font-size: 9pt; color: #7b8794; } }
        body { font-family: sans-serif; color: #1f2933; font-size: 9pt; }
        h1 { color: #1d4e89; font-size: 18pt; margin: 0 0 2px 0; }
        .sub { color: #52606d; margin-bottom: 14px; }
        table { width: 100%; border-collapse: collapse; -fs-table-paginate: paginate; }
        thead { display: table-header-group; }
        th { background: #1d4e89; color: #ffffff; text-align: left; padding: 5px 6px; }
        td { border-bottom: 1px solid #e4e7eb; padding: 4px 6px; }
        tr { page-break-inside: avoid; }
        tbody tr:nth-child(even) td { background: #f5f7fa; }
    </style>
</head>
<body>
<!-- Usa todas las columnas del archivo: no necesita mapeo -->
<h1 th:text="${archivo}">Listado</h1>
<div class="sub"><span th:text="${total}">0</span> registros · <span th:text="${fecha}">fecha</span></div>
<table>
    <thead>
    <tr><th th:each="c : ${columnas}" th:text="${c}">Columna</th></tr>
    </thead>
    <tbody>
    <tr th:each="r : ${registros}"><td th:each="v : ${r}" th:text="${v}">valor</td></tr>
    </tbody>
</table>
</body>
</html>
