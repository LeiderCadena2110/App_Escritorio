# App de escritorio: Spring Boot sin servidor web
spring.application.name=automatizador-reportes
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base local en la carpeta del usuario (~ = C:\Users\<usuario> en Windows, /Users/<usuario> en macOS)
spring.datasource.url=jdbc:h2:file:~/.automatizador-reportes/datos
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Registro en ~/.automatizador-reportes/app.log
logging.file.name=${user.home}/.automatizador-reportes/app.log
logging.level.root=WARN
logging.level.co.edu.ucc.reportes=INFO
