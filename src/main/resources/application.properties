# Desktop app: Spring Boot without a web server
spring.application.name=stockflow
spring.main.web-application-type=none
spring.main.banner-mode=off

# Local database in the user's home folder (~ = C:\Users\<user> on Windows, /Users/<user> on macOS)
spring.datasource.url=jdbc:h2:file:~/.stockflow/data
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Log file in ~/.stockflow/app.log
logging.file.name=${user.home}/.stockflow/app.log
logging.level.root=WARN
logging.level.co.edu.ucc.stockflow=INFO
