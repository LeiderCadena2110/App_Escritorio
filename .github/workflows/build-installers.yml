# Builds the installers on each operating system (jpackage cannot cross-compile).
# Runs manually (Actions > Build installers > Run workflow) or when a v1.0.0-style tag is pushed.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022        # ships WiX 3.14, needed for the .exe with JDK 21
            script: packaging\build-windows.bat exe
          - os: macos-14            # Apple Silicon
            script: packaging/build-macos.sh
          - os: macos-15-intel      # Intel
            script: packaging/build-macos.sh
          - os: ubuntu-24.04
            script: packaging/build-linux.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B package
      - name: Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y fakeroot libfuse2
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool && sudo mv appimagetool /usr/local/bin/
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: ${{ matrix.script }}
      - name: Package (macOS and Linux)
        if: runner.os != 'Windows'
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: target/installers/*
      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/installers/*
