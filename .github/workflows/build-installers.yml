# Builds the installers on each operating system (jpackage cannot cross-compile).
# Runs manually (Actions > Build installers > Run workflow: the installers stay as downloadable
# artifacts of the run) or when a v2.0.0-style tag is pushed (they are also published as a Release).
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the Release; the default token is read-only

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022        # ships WiX 3.14, needed for the .exe with JDK 21
            script: packaging\build-windows.bat exe
          - os: macos-15            # Apple Silicon (macos-14 was retired in November 2026)
            script: packaging/build-macos.sh
          - os: macos-15-intel      # Intel
            script: packaging/build-macos.sh
          - os: ubuntu-24.04
            script: packaging/build-linux.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B package
      - name: Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y fakeroot libfuse2
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool && sudo mv appimagetool /usr/local/bin/
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: ${{ matrix.script }}
      - name: Package (macOS and Linux)
        if: runner.os != 'Windows'
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.os }}
          path: target/installers/*
          if-no-files-found: error

  # One job publishes everything, so the four builds do not race to create the same Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: StockFlow ${{ github.ref_name }}
          files: installers/*
          body: |
            Instaladores de StockFlow (no necesitan Java):
            - **Windows:** `StockFlow-*.exe`
            - **macOS:** `.dmg` (Apple Silicon o Intel). La primera vez: Configuración del sistema › Privacidad y seguridad › "Abrir de todos modos".
            - **Linux:** `.deb` (Ubuntu, Debian, Mint) o `.AppImage`.

            Cambios: ver CHANGELOG.md.
